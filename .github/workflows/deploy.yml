name: Deploy

on:
    push:
        branches: [main]

jobs:
    deploy:
        name: Deploy to VPS
        runs-on: ubuntu-latest
        steps:
            - name: Deploy via SSH
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
              run: |
                  echo "$VPS_SSH_KEY" > /tmp/deploy_key
                  chmod 600 /tmp/deploy_key

                  ssh -i /tmp/deploy_key \
                      -o StrictHostKeyChecking=no \
                      -p 51588 \
                      deploy@$VPS_HOST << 'EOF'
                  set -e
                  cd /opt/livechat/repo
                  git pull
                  CI=true pnpm install --frozen-lockfile
                  pnpm build
                  sudo /usr/bin/systemctl restart livechat.service
                  echo "Deploy OK"
                  EOF

                  rm /tmp/deploy_key
